<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      홈 화면에 추가했을 때 브라우저가 아닌 앱처럼(전체화면) 실행되게 한다.
      주소창과 하단 툴바가 사라지므로 시연 영상 촬영에도 이 상태를 쓴다.

      apple-mobile-web-app-capable 은 iOS 전용이지만 manifest 의 display 보다 우선한다.
      Android 는 manifest 의 display:standalone 을 읽는데, HTTPS 가 아니면 적용되지 않을 수 있다.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="찰떡귱합" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="부부의 금융 궁합을 진단하고 맞춤 금융 상품을 추천하는 서비스"
    />

    <!-- iOS 는 투명 배경을 검게 채우므로 배경이 들어간 logo-bg.png 로 만든 아이콘을 쓴다. -->
    <link rel="apple-touch-icon" href="/app-icon-180.png" />
    <link rel="icon" type="image/png" href="/app-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>찰떡귱합</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
