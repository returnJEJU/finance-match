# 프론트 상자 안 nginx 설정.
#
# 하는 일은 두 가지다.
#   ① 화면 요청  → 내가 가진 dist 파일을 준다
#   ② /api 요청  → 백엔드 상자(톰캣)로 넘긴다
#
# ②가 있어서 브라우저 입장에서는 화면과 API 가 같은 주소가 된다.
# 그래서 CORS 가 아예 발생하지 않는다 (백엔드의 CORS 설정은 타지 않는다).

server {
    listen 80;
    server_name _;

    # 도커 내장 DNS. 백엔드 주소를 주기적으로 다시 물어보게 한다.
    #
    #   nginx 는 proxy_pass 에 이름을 그대로 쓰면 기동할 때 딱 한 번만 IP 로 바꿔 기억한다.
    #   백엔드 컨테이너를 다시 만들면서 IP 가 달라지면, nginx 는 사라진 옛 주소로 계속 보내
    #   502 를 낸다 — 그것도 nginx 를 재시작할 때까지 영구히.
    #
    #   배포는 백엔드만 교체되는 경우가 흔하므로(프론트 화면이 안 바뀐 배포) 반드시 필요하다.
    #   아래 proxy_pass 들이 변수를 쓰는 것도 같은 이유다 — 변수를 써야 매 요청 이 resolver 를
    #   거치고, 이름을 직접 쓰면 다시 기동 시점에 한 번만 확인하는 동작으로 돌아간다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 응답 압축. js 번들이 커서 체감 차이가 크다.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 서버 버전 노출 차단
    server_tokens off;

    # ── ② API → 백엔드 상자 ──
    #   backend 는 docker-compose 의 서비스 이름이다. 도커가 이름으로 찾아준다.
    #   경로를 그대로 넘긴다: /api/v1/auth/login → http://backend:8080/api/v1/auth/login
    location /api/ {
        # 변수를 쓰면 proxy_pass 에 경로를 붙이지 않는다 — 요청 경로가 그대로 전달된다.
        # /api/v1/auth/login → http://backend:8080/api/v1/auth/login
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 리포트 계산처럼 오래 걸리는 요청이 있어 넉넉히 준다.
        proxy_read_timeout 60s;
    }

    # ── API 문서 (백엔드 WAR 안에 들어있다) ──
    #   DispatcherServlet 은 /api/* 에만 매핑돼 있어서 문서는 /api 밖에 있다.
    #   여기를 안 열면 배포 후 문서 화면이 안 뜬다.
    location /swagger-ui/ {
        set $docs_upstream backend:8080;
        proxy_pass http://$docs_upstream;
        proxy_set_header Host $host;
    }

    location = /openapi.yaml {
        set $openapi_upstream backend:8080;
        proxy_pass http://$openapi_upstream;
        proxy_set_header Host $host;
    }

    # ── 정적 파일 캐시 ──
    #   Vite 가 파일명에 해시를 붙이므로(app-a1b2c3.js) 오래 캐시해도 안전하다.
    #   내용이 바뀌면 파일명이 바뀌어 브라우저가 새로 받는다.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── ① 화면 ──
    #   try_files 가 핵심이다.
    #   Vue Router 가 history 모드(createWebHistory)라 /report 같은 주소는
    #   서버에 실제 파일로 존재하지 않는다. 이 줄이 없으면 새로고침할 때마다 404 가 난다.
    #   "파일 없으면 index.html 을 줘라" → 그다음은 Vue Router 가 알아서 그린다.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # index.html 은 캐시하지 않는다. 캐시되면 배포해도 옛 화면이 계속 뜬다.
        add_header Cache-Control "no-cache";
    }
}
