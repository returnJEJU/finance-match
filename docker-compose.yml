# 로컬 개발 인프라 — MySQL + Redis.
#
# 팀원은 clone 후 프로젝트 루트에서:
#   docker compose up -d       # MySQL·Redis 띄우기 (빈 DB 로 뜬다)
#   docker compose down        # 정지 (데이터는 볼륨에 유지)
#
# 스키마·시드는 여기서 넣지 않는다. Flyway 가 적용한다.
#   cd backend && ./gradlew flywayMigrate     (또는 앱을 기동하면 자동)
# 완전 초기화가 필요할 때만: docker compose down -v && docker compose up -d
#
# 백엔드(Spring)는 IDE/Gradle 로, 프론트(Vue)는 npm 으로 각자 실행한다.
# Nginx·앱 컨테이너는 배포(운영) 단계에서 추가한다.

services:
  mysql:
    image: mysql:8.4
    container_name: finance-match-mysql
    environment:
      MYSQL_DATABASE: finance_match
      MYSQL_USER: fmatch
      MYSQL_PASSWORD: fmatch
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: finance-match-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
