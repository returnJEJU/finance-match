# 의존성 취약점·업데이트 알림.
#
# 과정 규정상 Spring Boot 를 못 쓰고 Spring Framework 5.3 Legacy 로 고정돼 있어, 알려진 CVE 가
# 있어도 지금은 확인할 방법이 없다. 먼저 "무엇이 취약한지 아는 것" 까지가 목표다.
# 버전을 실제로 올릴지는 별개 판단이며, 규정 때문에 못 올리는 항목도 있을 수 있다.
#
# open-pull-requests-limit 을 낮게 잡은 이유: 처음 켜면 밀린 업데이트가 한꺼번에 올라와
# PR 목록이 묻힌다. 발표(8/26) 전까지는 알림 위주로 받고, 여유가 생기면 늘린다.

version: 2

updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      # 커밋 컨벤션에 맞춘다 (AGENTS.md — type(scope): 제목)
      prefix: 'chore(be)'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(fe)'

  # 워크플로가 쓰는 액션(actions/checkout 등)도 갱신 대상이다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(infra)'
