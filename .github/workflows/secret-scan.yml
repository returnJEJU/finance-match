# 시크릿 유출 검사 (gitleaks).
#
# 실제 비밀값(application-secret.properties)은 지금 .gitignore 하나로만 막고 있다. 파일명을
# 다르게 만들거나, 다른 파일에 키를 직접 적거나, `git add -f` 를 쓰면 그대로 올라간다.
# 이 저장소는 공개(public)라 한 번 커밋되면 유출 즉시 유효하고, 히스토리에 남아 되돌리기도 어렵다.
#
# 공식 gitleaks-action 을 쓰지 않는 이유:
#   조직 계정 저장소를 스캔하려면 라이선스 키(GITLEAKS_LICENSE)를 발급받아 시크릿으로 등록해야 한다.
#   gitleaks CLI 자체는 MIT 라이선스로 자유롭게 쓸 수 있으므로, 공식 배포 바이너리를 받아 직접 돌린다.
#
# --redact 를 반드시 붙인다:
#   공개 저장소라 Actions 로그도 공개된다. 붙이지 않으면 유출을 잡는 순간 그 값이 로그에 그대로
#   찍혀 오히려 더 널리 퍼진다.

name: secret scan

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      # 히스토리 전체를 스캔하므로 얕은 클론(기본값)으로는 부족하다.
      - name: 코드 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks 설치
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      # v8.19 부터 detect 는 deprecated 다. git 하위 명령을 쓴다.
      # 유출이 있으면 종료코드 1 로 끝나 검사가 실패한다.
      - name: 시크릿 검사
        run: ./gitleaks git . --redact --verbose
