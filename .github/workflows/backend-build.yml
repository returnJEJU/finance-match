# 백엔드 검사 — 컴파일 + 테스트.
#
# 컴파일되지 않는 코드가 리뷰를 통과해 develop 이 멈추는 일을 막는다.
# 작성자 로컬에만 있는 파일(git add 를 빠뜨린 새 파일)이나, 선언되지 않은 메서드 호출은
# 사람 눈으로는 잡기 어렵다. 깨끗한 환경에서 컴파일해보면 바로 드러난다.
#
# 【테스트도 함께 돌린다】
#   전에는 컴파일만 했다 — DB 연동 테스트가 MySQL 을 필요로 해서다.
#   그 사이에 테스트 2건이 깨진 채로 develop 에 머지됐고, 아무도 모르고 있었다.
#   서비스 컨테이너로 MySQL·Redis 를 띄우면 로컬과 같은 조건이 되므로 전부 돌릴 수 있다.
#
#   접속 정보는 application-local.properties 와 맞춘다(단일 출처).
#   스키마는 앱이 뜰 때 Flyway 가 적용한다 — 별도 준비 단계가 필요 없다.
#
# 【시간대를 반드시 맞춘다】
#   운영·로컬 모두 Asia/Seoul 로 돌린다(docker-compose 의 TZ, 운영 톰캣의 -Duser.timezone).
#   CI 만 UTC 로 두면 추천 최신성 판정이 9시간 어긋나 테스트가 무더기로 깨진다 —
#   JDBC(serverTimezone=Asia/Seoul)로 쓴 값은 KST 벽시계, DB 기본값(CURRENT_TIMESTAMP)으로
#   쓴 값은 UTC 가 되어, 입력이 추천보다 최신인 것처럼 보이기 때문이다.
#   실제로 이 설정을 빠뜨려 RecommendationServiceTest 4건이 CI 에서만 실패했다.

name: backend build

on:
  # develop·main 으로 가는 PR 이 열리거나 갱신될 때
  pull_request:
    branches: [develop, main]
  # develop 에 머지된 직후에도 확인한다.
  # PR 두 개가 각각은 통과했는데 합치면 깨지는 경우는 PR 검사만으로는 잡히지 않는다.
  push:
    branches: [develop]

# 코드를 읽는 권한만 준다.
permissions:
  contents: read

# 러너 JVM 의 기본 시간대. DB 컨테이너와 같은 값으로 맞춘다.
env:
  TZ: Asia/Seoul

# PR 은 연달아 push 하면 앞선 실행을 취소해 실행 시간을 아낀다.
# develop push 는 취소하지 않는다 — 취소된 실행도 커밋 옆에 빨간 X 로 표시되어
# "컴파일 실패" 와 구분되지 않는다. develop 은 머지가 잦지 않아 아낄 시간도 거의 없고,
# "이 커밋이 정상인가" 라는 기록이 남는 편이 훨씬 중요하다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 잡 이름을 바꾸지 않는다.
  #   저장소 룰셋이 "backend-compile" 을 필수 검사로 지정하고 있다. 이름을 바꾸면 그 이름의
  #   검사가 영영 오지 않아 PR 이 "검사 대기 중" 으로 머지되지 않는다.
  #   바꾸려면 저장소 설정(룰셋)의 필수 검사 이름을 먼저 고쳐야 한다.
  backend-compile:
    runs-on: ubuntu-latest

    # 테스트가 실제로 붙는 DB·캐시. 로컬 docker-compose 와 같은 이미지·같은 접속 정보다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: finance_match
          MYSQL_USER: fmatch
          MYSQL_PASSWORD: fmatch
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        # 준비되기 전에 테스트가 시작되면 커넥션 실패로 엉뚱하게 깨진다.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 의존성 다운로드 결과를 캐시해 두 번째 실행부터 빨라진다.
          cache: gradle

      # test 는 main·test 소스를 모두 컴파일한 뒤 실행하므로, 컴파일 검사를 겸한다.
      - name: 컴파일 · 테스트
        run: ./gradlew test --no-daemon
        working-directory: backend

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 로그만으로는 보기 어렵다.
      # HTML 리포트를 받아두면 브라우저로 열어 바로 확인할 수 있다.
      - name: 테스트 리포트 보관 (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
