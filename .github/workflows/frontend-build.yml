# 프론트엔드 검사 — 린트 + 프로덕션 빌드.
#
# 백엔드는 backend-build.yml 이 컴파일을 검사하는데 프론트는 아무 검사도 없었다.
# 같은 저장소인데 한쪽만 보호받는 상태였다.
#
# 빌드까지 돌리는 이유: `npm run dev` 는 요청한 모듈만 변환하므로, 실제로 열어보지 않은 화면의
# import 경로 오타나 없는 컴포넌트 참조가 그대로 숨는다. 프로덕션 빌드는 전체를 묶기 때문에
# 여기서 드러난다. 배포 직전에 처음 빌드해보고 터지는 상황을 막는다.
#
# 린트는 lefthook 이 커밋 시 자동 적용하지만, 훅 설치(`npm install`)를 빠뜨린 사람은 그대로
# 통과한다. CI 는 훅이 없어도 막히게 하는 방어선이다.

name: frontend build

on:
  # develop·main 으로 가는 PR 이 열리거나 갱신될 때
  pull_request:
    branches: [develop, main]
  # develop 에 머지된 직후에도 확인한다.
  push:
    branches: [develop]

# 코드를 읽는 권한만 준다.
permissions:
  contents: read

# PR 은 연달아 push 하면 앞선 실행을 취소해 실행 시간을 아낀다.
# develop push 는 취소하지 않는다 — 취소된 실행도 커밋 옆에 빨간 X 로 표시되어
# "빌드 실패" 와 구분되지 않는다. (backend-build.yml 과 같은 판단)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # vite 8 이 요구하는 최소 버전은 ^20.19.0 || >=22.12.0 이다. LTS 인 22 로 고정한다.
      - name: Node 22 설치
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 두 번째 실행부터 의존성 다운로드를 캐시에서 가져온다.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # install 이 아니라 ci 를 쓴다 — lock 파일 그대로 설치해 로컬과 CI 의 의존성이 어긋나지 않게 한다.
      - name: 의존성 설치
        run: npm ci
        working-directory: frontend

      # `npm run lint` 는 --fix 가 붙어 있어 문제를 고쳐놓고 통과시킨다. CI 는 검사만 해야 하므로
      # --fix 없는 lint:ci 를 쓴다.
      - name: 린트 검사
        run: npm run lint:ci
        working-directory: frontend

      - name: 프로덕션 빌드
        run: npm run build
        working-directory: frontend
