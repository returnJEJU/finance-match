# 운영 배포용 — 상자 4개를 한 번에 띄운다.
#
#   📦 frontend (nginx)  ← 유일하게 외부에 열림 (80)
#   📦 backend  (톰캣 9)
#   📦 mysql
#   📦 redis
#
# 로컬 개발용 docker-compose.yml 과는 별개 파일이다. 로컬은 DB·Redis 만 띄우고
# 백엔드·프론트는 IDE/npm 으로 돌리는 게 편하므로 그대로 둔다.
#
# 【실행 방법】
#   1. .env.prod.example 을 복사해 .env 를 만들고 비밀값을 채운다
#   2. 백엔드 WAR·프론트 dist 를 미리 빌드해둔다 (DEPLOY.md 참고)
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# 【포트를 왜 mysql·redis 에 안 여는가】
#   상자끼리는 도커가 만든 내부 네트워크로 서비스 이름(mysql, redis)으로 통신한다.
#   외부에 포트를 열 이유가 없다. 열면 서버 IP 만 알면 DB 에 직접 붙을 수 있게 된다.

# 프로젝트 이름을 로컬 개발용(docker-compose.yml)과 반드시 다르게 둔다.
#   이름이 같으면 도커가 "같은 프로젝트"로 보고 로컬 개발 컨테이너를 이 설정으로 교체해버리고,
#   볼륨(DB 데이터)도 공유한다. 그러면 개발 DB 위에 운영 설정이 얹혀 비밀번호가 안 맞는다.
name: finance-match-prod

services:
  # ──────────────────────────────────────────────────────────
  #  MySQL — 데이터 저장
  # ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: fm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finance_match
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      # 이름 있는 볼륨. 상자를 지우고 다시 만들어도 데이터는 남는다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 백엔드가 DB 준비 전에 뜨면 커넥션 실패로 기동이 깨진다. 준비될 때까지 기다리게 한다.
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ──────────────────────────────────────────────────────────
  #  Redis — refresh 토큰 · 로그아웃 블랙리스트
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: fm-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────
  #  백엔드 — 톰캣 9 + ROOT.war
  # ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: fm-backend
    restart: unless-stopped
    environment:
      # DB·Redis 주소의 host 자리에 서비스 이름을 쓴다. 도커가 이름으로 찾아준다.
      DB_URL: 'jdbc:mysql://mysql:3306/finance_match?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8'
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # 리포트 종합 코멘트를 만드는 OpenAI 키.
      #   비워두면 코멘트 생성만 건너뛰고 나머지는 정상 동작한다(앱은 뜬다).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # 기동할 때 DB 스키마를 자동으로 만든다.
      #   운영 기본값은 false 다(여러 대가 동시에 뜰 때 마이그레이션이 겹치는 걸 막으려고).
      #   우리는 백엔드가 딱 한 대라 겹칠 일이 없고, 서버에 Gradle 을 깔지 않아도 되므로 켠다.
      FLYWAY_ENABLED: 'true'

      # -Dspring.profiles.active=prod → application-prod.properties 를 읽게 한다.
      #   이게 빠지면 local 설정(localhost DB)을 읽어서 기동에 실패한다.
      # -Xmx640m → 2GB 서버에서 톰캣이 메모리를 독차지하지 않게 상한을 둔다.
      CATALINA_OPTS: '-Xms256m -Xmx640m -Dspring.profiles.active=prod -Duser.timezone=Asia/Seoul -Dfile.encoding=UTF-8'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  #  프론트 — nginx + dist  (외부에 열리는 유일한 상자)
  # ──────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: fm-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
