# 로컬 개발 설정. docker-compose 로 띄운 MySQL/Redis 를 기준으로 한다.
# 여기의 값은 로컬 전용 더미값이다. 실제 운영 비밀값은 절대 넣지 않는다.

# ===== DB (MySQL) =====
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/finance_match?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
jdbc.username=fmatch
jdbc.password=fmatch

# ===== Redis =====
redis.host=localhost
redis.port=6379
redis.password=

# ===== JWT (로컬 전용 값. 운영은 환경변수로 주입) =====
jwt.secret=local-development-secret-key-change-this-value-please-1234567890
jwt.access-token-validity-ms=3600000
jwt.refresh-token-validity-ms=1209600000

# ===== CORS =====
cors.allowed-origins=http://localhost:5173
