# 운영 설정. 모든 비밀값은 환경변수로 주입한다. 기본값(더미)을 두지 않는다.
# 주입 경로: GitHub Actions secrets -> docker run -e -> 여기

# ===== DB (MySQL) =====
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=${DB_URL}
jdbc.username=${DB_USERNAME}
jdbc.password=${DB_PASSWORD}

# ===== Flyway (DB 마이그레이션) =====
# 운영은 기동 시 자동 적용하지 않는다(인스턴스 경합·의도치 않은 스키마 변경 방지).
# 배포 파이프라인이 ./gradlew flywayMigrate -Pprod 로 적용한다.
flyway.enabled=${FLYWAY_ENABLED:false}
flyway.locations=classpath:db/migration

# ===== Redis =====
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT}
redis.password=${REDIS_PASSWORD:}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-ms=3600000
jwt.refresh-token-validity-ms=1209600000

# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost}

# ===== OpenAI (리포트 종합 코멘트 생성) =====
# 키가 없어도 앱은 정상 기동한다. 코멘트 생성만 건너뛴다
# (OverallCommentService 가 @Async 로 돌고 실패를 삼킨다).
# 그래서 기본값을 빈 값으로 두어, 키 없이도 배포가 가능하게 한다.
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
