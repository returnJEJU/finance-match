<!doctype html>
<!--
  API 문서 뷰어.

  이 파일과 옆의 swagger-ui-*.js·css 는 Swagger UI 배포본(Apache-2.0, LICENSE 참고)이다.
  springdoc·springfox 같은 라이브러리를 쓰지 않고 정적 파일로 두는 이유는, 두 라이브러리 모두
  Spring Boot 를 전제로 만들어져 순수 Spring Framework 5.3 + WAR 배포에서 기동이 깨질 위험이
  있기 때문이다. 정적 파일은 애플리케이션 런타임에 아무 영향을 주지 않는다.

  DispatcherServlet 이 /api/* 에만 매핑돼 있어(WebAppInitializer) 이 경로는 톰캣 기본 서블릿이
  그대로 내보낸다 — Spring 설정을 건드릴 필요가 없다.

  주소: http://localhost:8080/swagger-ui/index.html
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>찰떡귱합 API 문서</title>
    <link rel="stylesheet" href="./swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <script src="./swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        // 이 파일 기준 상대 경로 → http://localhost:8080/openapi.yaml
        url: '../openapi.yaml',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis],
        // StandaloneLayout 은 별도 preset 이 필요하다. 다른 스펙 URL 을 입력받는 상단 검색바를
        // 붙이는 용도라 우리에겐 필요 없어 기본 레이아웃을 쓴다.
        layout: 'BaseLayout',
        deepLinking: true,
        // 태그(auth·member·asset)는 접힌 채로 시작한다. 엔드포인트가 늘어도 한눈에 보인다.
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: true,
        // "Try it out" 은 같은 오리진(localhost:8080)으로 요청하므로 CORS 문제가 없다.
        // 인증이 필요한 API 는 우측 상단 Authorize 에 accessToken 을 넣고 실행한다.
        persistAuthorization: true,
      })
    </script>
  </body>
</html>
