# ==========================================================================
#  팀원용 — 자기 도메인을 추가할 때 (AI 에게 이 파일을 통째로 주고 아래를 그대로 요청)
# ==========================================================================
#
#  "이 openapi.yaml 에 <도메인명> API 를 추가해줘. 아래 규칙을 지켜."
#
#  1. 근거는 코드다. backend/src/main/java/com/financematch/<도메인>/ 의
#     controller · dto · domain(enum) 과 common/ErrorCode.java 를 읽고 쓴다.
#     읽지 않은 것을 추측해서 쓰지 않는다. 확인이 안 되면 물어본다.
#
#  2. 경로는 `/v1/...` 로 쓴다. `/api` 는 servers 가 이미 담당하므로 붙이지 않는다.
#     (컨트롤러의 @RequestMapping 값이 그대로 여기 경로가 된다)
#
#  3. 모든 응답은 공통 봉투로 감싼다. 기존 항목과 똑같은 allOf 형태를 쓴다.
#       성공: ApiResponse 를 allOf 로 상속하고 data 만 자기 스키마로 지정
#       실패: ApiErrorResponse 를 그대로 참조
#     성공 응답의 message 는 항상 null 이다 — 안내 문구를 채우지 않는다.
#
#  4. 실패 응답 설명에는 ErrorCode enum 이름을 반드시 적는다. 예: (`INVITATION_NOT_FOUND`)
#     HTTP 상태는 ErrorCode 에 정의된 값과 일치해야 한다. 임의로 정하지 않는다.
#
#  5. 인증이 필요한 API 는 security 를 쓰지 않는다(파일 맨 아래 전역 bearerAuth 가 적용된다).
#     로그인 없이 쓰는 공개 API 에만 `security: []` 를 명시한다.
#
#  6. 스키마 이름은 자바 DTO 클래스명과 똑같이 짓는다(예: CreateCoupleRequest).
#     enum 값은 자바 enum 과 글자까지 일치시킨다(예: Gender 는 FEMALE 이 아니라 F).
#
#  7. tags 에 자기 도메인을 추가하고 각 operation 에 그 태그를 단다.
#
#  8. 다 쓰면 문법을 검사한다:
#       python3 -c "import yaml;yaml.safe_load(open('backend/src/main/webapp/openapi.yaml'))"
#     그리고 톰캣을 띄워 http://localhost:8080/swagger-ui/index.html 에서 눈으로 확인한다.
#
#  ⚠️ 이 파일은 코드에서 자동 생성되지 않는다. API 를 바꾸는 PR 에서 이 파일도 함께 고친다.
# ==========================================================================

openapi: 3.0.3

info:
  title: 찰떡귱합 API — 인증·자산
  version: "1.0.0"
  description: |
    부부·커플 금융궁합도 진단 + 금융상품 추천 서비스의 백엔드 API 명세.

    **현재 담은 범위는 인증(auth)·자산(asset) 도메인이다.** 커플·초대·설문·추천·리포트는
    각 담당자가 이 파일에 자기 구획을 추가한다.

    ### 이 문서를 쓰는 규칙
    이 파일은 코드에서 자동 생성되지 않고 **손으로 관리한다**. 따라서 **API 를 바꾸는 PR 에서
    이 파일도 함께 고친다.** 고치지 않으면 아무 오류 없이 문서만 낡는다.

    ### 공통 응답 형식
    성공·실패와 무관하게 항상 같은 봉투로 감싼다.
    ```
    성공: { "success": true,  "data": { ... }, "message": null, "code": null }
    실패: { "success": false, "data": null,    "message": "이미 가입된 이메일입니다.", "code": "EMAIL_EXISTS" }
    ```
    프론트의 `src/api/client.js` 인터셉터가 **성공 시 `data` 만 꺼내 반환**하고, 실패는
    `ApiError(message, code, status)` 로 던진다. 따라서 **성공 응답의 `message` 는 쓰이지 않으며
    서버도 채우지 않는다** — 안내 문구는 프론트가 표시한다.

servers:
  - url: /api
    description: |
      DispatcherServlet 이 `/api/*` 에 매핑돼 있고 컨트롤러가 `/v1` 을 쓴다.
      따라서 실제 주소는 `/api` + 아래 경로다 (예: `/api/v1/auth/login`).

tags:
  - name: auth
    description: 인증 — 회원가입·로그인·로그아웃
  - name: member
    description: 회원 계정 — 회원탈퇴
  - name: asset
    description: 자산 연동 (마이데이터)

paths:
  /v1/auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      description: |
        계정을 만들고 약관 동의를 함께 저장한다. 필수 약관 4종에 모두 동의해야 한다.

        응답의 `accessToken` 은 **다음 단계인 자산연동을 인증하기 위한 것**이다. 로그인이 아니므로
        `last_login_at` 은 갱신되지 않는다 — 가입 후 최초 로그인이 첫 로그인으로 판별되어야 한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        "201":
          description: "가입 성공. `Location: /api/v1/members/me`"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SignupResponse' }
        "400":
          description: 입력값 형식 오류(`INVALID_INPUT`) 또는 필수 약관 미동의(`CONSENT_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }
        "409":
          description: 이미 가입된 이메일(`EMAIL_EXISTS`). **탈퇴한 회원의 이메일도 계속 점유된다.**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: |
        토큰과 다음 화면 판단용 정보를 함께 돌려준다.

        "없는 이메일"·"비밀번호 불일치"·"탈퇴 회원"을 모두 `INVALID_CREDENTIALS` 하나로 응답한다.
        구분해서 알려주면 응답만 비교해 가입된 이메일 목록을 만들 수 있다(계정 열거).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        "400":
          description: 이메일·비밀번호 누락(`INVALID_INPUT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }
        "401":
          description: 이메일 또는 비밀번호 불일치(`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      description: |
        **서버는 성공만 반환한다.** JWT 는 서버가 로그인 상태를 들고 있지 않아 지울 세션이 없다.

        실제 무효화는 **클라이언트가 accessToken 을 삭제해서** 이뤄진다. 토큰 자체는 만료(1시간)
        전까지 유효하므로, 로그아웃 성공 시 반드시 저장된 토큰을 지워야 한다.

        즉시 무효화가 필요해지면 Redis 블랙리스트를 얹는다 — 그때도 이 계약(경로·요청·응답)은
        그대로 두고 서버 내부만 바뀐다.
      responses:
        "200":
          description: 로그아웃 성공. `data` 는 `null` 이다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, nullable: true, example: null }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/members/me:
    delete:
      tags: [member]
      summary: 회원탈퇴
      description: |
        계정을 **soft delete** 한다 — 행을 지우지 않고 `status = WITHDRAWN` + `deleted_at` 을
        기록한다. 커플·설문·리포트·추천이 회원을 참조하고 있어 실제로 지우면 함께 무너지고,
        탈퇴 사실 자체도 감사·복구를 위해 남아야 한다.

        **되돌리기 어려운 동작이라 토큰만으로 처리하지 않는다** — 비밀번호(본인 확인)와
        확인 문구(실수 방지)를 함께 받는다.

        ### 프론트 주의사항
        - **DELETE 인데 요청 본문이 있다.** axios 는 두 번째 인자가 config 이므로 `data` 로 감싼다:
          `api.delete('/v1/members/me', { data: { password, confirmationText } })`
        - **`INVALID_PASSWORD` 는 400 이다(401 아님).** 401 이면 `client.js` 인터셉터가 토큰을
          지워버려 비밀번호를 한 번 틀렸을 뿐인데 탈퇴 화면에서 로그아웃된다. 400 이므로
          입력창 아래 인라인으로 표시하고 화면을 유지한다.
        - **탈퇴 성공 후 반드시 토큰을 지운다.** 지우지 않으면 그 토큰으로 재요청 시 409 가 온다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawRequest' }
      responses:
        "200":
          description: 탈퇴 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WithdrawResponse' }
        "400":
          description: |
            비밀번호 불일치(`INVALID_PASSWORD`) 또는 확인 문구 불일치(`INVALID_CONFIRMATION`).
            **둘 다 화면을 유지한 채 다시 입력받아야 하는 상황이다.**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: 회원 정보를 찾을 수 없음(`MEMBER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }
        "409":
          description: 이미 탈퇴한 회원(`MEMBER_ALREADY_WITHDRAWN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  /v1/members/me/assets:
    post:
      tags: [asset]
      summary: 자산 연동 (최초 1회)
      description: |
        마이데이터에서 금융 정보를 받아 회원의 금융 요약을 저장한다.

        **커플 합산이 아니라 회원별 개인 연동이다.** 각 회원이 자기 토큰으로 호출해 자기
        `member_id` 에만 저장하고, 궁합 계산·공동 추천 단계에서 두 회원의 개인 요약을 조회해 합산한다.

        현재는 외부 목 서버 대신 `SimpleMyDataProvider` 가 예비부부용 시나리오 두 개를 돌려준다
        (임시로 홀수 회원 ID = 개인 A, 짝수 = 개인 B). 목 서버를 붙일 때 `MyDataProvider` 의 HTTP
        구현으로 교체하며 이 계약은 바뀌지 않는다.

        **이미 연동된 회원은 409 다.** 다시 불러오려면 `/assets/refresh` 를 쓴다.
      responses:
        "201":
          description: "연동 성공. `Location: /api/v1/members/me/assets`"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AssetLinkResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "409":
          description: 이미 자산 연동이 완료됨(`ASSET_ALREADY_LINKED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }
        "502": { $ref: '#/components/responses/MyDataLinkFailed' }

  /v1/members/me/assets/refresh:
    post:
      tags: [asset]
      summary: 자산 갱신 (재연동)
      description: |
        마이데이터를 다시 불러와 저장된 금융 요약을 **덮어쓴다**(upsert).

        `/assets` 와 달리 이미 연동돼 있어도 409 가 아니다. 응답 형식은 같다.
      responses:
        "200":
          description: 갱신 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AssetLinkResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/MyDataLinkFailed' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        로그인·회원가입이 발급한 accessToken 을 `Authorization: Bearer <token>` 으로 보낸다.
        유효기간은 1시간이다.

  responses:
    Unauthorized:
      description: |
        인증 토큰이 없거나 유효하지 않음(`UNAUTHORIZED`).

        참고로 현재 경로 규칙이 전부 `permitAll` 이라 토큰이 만료·위조된 경우에도
        `INVALID_TOKEN`·`EXPIRED_TOKEN` 이 아니라 `UNAUTHORIZED` 로 응답한다.
        (필터는 사유를 정확히 판별해 로그에 남긴다)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    MyDataLinkFailed:
      description: 마이데이터를 불러오지 못함(`MYDATA_LINK_FAILED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  schemas:

    ApiResponse:
      type: object
      description: 모든 API 의 공통 성공 응답 봉투.
      required: [success, data, message, code]
      properties:
        success: { type: boolean, example: true }
        data:
          description: 엔드포인트별 실제 데이터. 없으면 `null`.
          nullable: true
        message:
          type: string
          nullable: true
          description: 성공 응답에서는 항상 `null` 이다. 안내 문구는 프론트가 표시한다.
          example: null
        code: { type: string, nullable: true, example: null }

    ApiErrorResponse:
      type: object
      description: 공통 실패 응답 봉투. `code` 는 백엔드 `ErrorCode` enum 이름이다.
      required: [success, data, message, code]
      properties:
        success: { type: boolean, example: false }
        data: { nullable: true, example: null }
        message:
          type: string
          description: 사용자에게 보여줄 수 있는 실패 사유.
          example: 이미 가입된 이메일입니다.
        code:
          type: string
          description: 프론트가 분기에 쓰는 식별자. **이름을 바꾸면 프론트도 함께 고쳐야 한다.**
          example: EMAIL_EXISTS

    SignupRequest:
      type: object
      required: [name, gender, birthDate, email, password, agreements]
      properties:
        name: { type: string, maxLength: 50, example: 홍길동 }
        gender:
          type: string
          enum: [F, M]
          description: 여성 `F` · 남성 `M`. **`FEMALE`·`MALE` 이 아니다.**
          example: F
        birthDate:
          type: string
          format: date
          description: 과거 날짜여야 한다.
          example: "1995-03-21"
        email: { type: string, format: email, maxLength: 255, example: hong@kb.com }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: Pw123456!
        agreements: { $ref: '#/components/schemas/SignupAgreementRequest' }

    SignupAgreementRequest:
      type: object
      description: |
        약관 동의. **필수 4종(`mydataTerms`·`privacy`·`assetLink`·`coupleShare`)이 모두 `true`**
        여야 하며, 아니면 `CONSENT_REQUIRED`(400) 다.
      required: [mydataTerms, privacy, assetLink, coupleShare]
      properties:
        mydataTerms: { type: boolean, description: 마이데이터 서비스 이용약관 (필수), example: true }
        privacy: { type: boolean, description: 개인정보 수집·이용 (필수), example: true }
        assetLink: { type: boolean, description: 자산정보 연동 (필수), example: true }
        coupleShare: { type: boolean, description: 자산 궁합 매칭·상대방 공유 (필수), example: true }
        marketing:
          type: boolean
          nullable: true
          description: 마케팅 수신 (선택). 값이 없으면 `false` 로 저장된다.
          example: false

    SignupResponse:
      type: object
      required: [member, accessToken]
      properties:
        member: { $ref: '#/components/schemas/SignupMemberResponse' }
        accessToken:
          type: string
          description: 다음 단계인 자산연동 인증용 토큰.
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.xxxxx

    SignupMemberResponse:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer, format: int64, example: 1 }
        email: { type: string, example: hong@kb.com }
        name: { type: string, example: 홍길동 }

    LoginRequest:
      type: object
      description: |
        이메일 형식은 검사하지 않는다 — 형식 오류든 값 오류든 모두 `INVALID_CREDENTIALS` 로
        응답해야 계정 존재 여부가 드러나지 않는다. 빈 값만 입력 누락으로 걸러낸다.
      required: [email, password]
      properties:
        email: { type: string, example: demo.a@chaltteok.dev }
        password: { type: string, format: password, example: Test1234! }

    LoginResponse:
      type: object
      required: [accessToken, member, isFirstLogin, progress]
      properties:
        accessToken:
          type: string
          description: 유효기간 1시간.
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.xxxxx
        member: { $ref: '#/components/schemas/LoginMemberResponse' }
        isFirstLogin:
          type: boolean
          description: 가입 후 한 번도 로그인한 적이 없으면 `true`. 온보딩 진입 판단에 쓴다.
          example: true
        progress: { $ref: '#/components/schemas/OnboardingStatusResponse' }

    LoginMemberResponse:
      type: object
      description: 로그인 응답에는 이메일을 담지 않는다(화면에 쓰지 않는다).
      required: [id, name]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: 홍길동 }

    OnboardingStatusResponse:
      type: object
      description: 온보딩 진행 상태. 로그인 직후 어느 화면으로 보낼지 판단하는 데 쓴다.
      required: [coupleConnected, hasInvitation, personalSurveyCompleted]
      properties:
        coupleConnected: { type: boolean, description: 파트너와 연결됐는가, example: false }
        hasInvitation:
          type: boolean
          description: >-
            초대코드를 발급한 적이 있는가(= 공동설문을 한 사람 = 초대를 **보낸** 사람).
            코드가 이미 쓰였는지는 보지 않는다 — 연결 후에도 `true` 로 남아 보낸 사람과 받은 사람을 가른다.
          example: false
        personalSurveyCompleted: { type: boolean, description: 개인 설문을 마쳤는가, example: false }
        partnerPersonalSurveyCompleted:
          type: boolean
          nullable: true
          description: 상대방이 개인 설문을 마쳤는가. **커플 연결 전에는 `null` 이다.**
          example: null

    WithdrawRequest:
      type: object
      required: [password, confirmationText]
      properties:
        password:
          type: string
          format: password
          description: 본인 확인용 현재 비밀번호.
          example: Pw123456!
        confirmationText:
          type: string
          description: 실수 방지용 확인 문구. **정확히 `회원 탈퇴`** (가운데 공백 1칸)여야 한다.
          example: 회원 탈퇴

    WithdrawResponse:
      type: object
      required: [memberId, status, withdrawnAt]
      properties:
        memberId: { type: integer, format: int64, example: 1 }
        status: { type: string, enum: [WITHDRAWN], example: WITHDRAWN }
        withdrawnAt:
          type: string
          format: date-time
          description: 탈퇴 처리 일시. 초 단위이며 DB 에 저장된 값과 같다.
          example: "2026-07-31T11:16:41"

    AssetLinkResponse:
      type: object
      required: [totalAsset, totalDebt, assetCount, summary, accounts, linkedAt]
      properties:
        totalAsset:
          type: number
          description: 총 금융자산(원). 카테고리별 금액의 합.
          example: 84200000
        totalDebt: { type: number, description: 총 부채(원), example: 0 }
        assetCount:
          type: integer
          description: 연동된 계좌·대출 건수.
          example: 5
        summary:
          type: array
          description: |
            카테고리별 금액. **응답을 만들 때만 쪼개 보여주는 값이고 DB 에는 합계만 저장된다** —
            재조회 시에는 이 구성을 복원할 수 없다.
          items: { $ref: '#/components/schemas/AssetSummaryResponse' }
        accounts: { $ref: '#/components/schemas/AssetAccountResponse' }
        linkedAt: { type: string, format: date-time, example: "2026-07-31T11:16:41" }

    AssetSummaryResponse:
      type: object
      required: [category, amount]
      properties:
        category:
          type: string
          enum: [BANK_CHECKING, BANK_SAVINGS, SECURITIES, INSURANCE]
          description: 입출금 · 예적금 · 증권(일반 투자) · 보험
          example: BANK_SAVINGS
        amount: { type: number, description: 해당 카테고리 금액(원), example: 50520000 }

    AssetAccountResponse:
      type: object
      description: 세제혜택 계좌 보유 여부. 연금·ISA 추천 자격 판단에 쓴다.
      required: [hasPensionSavings, hasIrp, hasIsa]
      properties:
        hasPensionSavings: { type: boolean, description: 연금저축 보유, example: true }
        hasIrp: { type: boolean, description: IRP 보유, example: false }
        hasIsa: { type: boolean, description: ISA 보유, example: true }

security:
  - bearerAuth: []
