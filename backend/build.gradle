// Flyway Gradle 플러그인이 MySQL 에 접속하려면 DB 모듈과 드라이버가
// 플러그인 클래스패스에 있어야 한다 (Flyway 10 부터 DB 지원이 모듈 분리).
buildscript {
    // plugins 블록의 버전과 동일하게 유지할 것
    ext.flywayVersion = '13.0.0'

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.flywaydb:flyway-mysql:${flywayVersion}"
        classpath 'com.mysql:mysql-connector-j:9.1.0'
    }
}

plugins {
    id 'java'
    id 'war'
    id 'jacoco'                                 // 테스트 커버리지 측정
    id 'org.flywaydb.flyway' version '13.0.0'   // buildscript.ext.flywayVersion 과 동일하게
}

group = 'com.financematch'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

// -------------------------------------------------------------------
//  과정 규정: Spring Boot / JPA 사용 불가.
//  Spring Framework 5.x Legacy + MyBatis + WAR 구성이다.
//  starter 나 spring-boot-* 의존성을 추가하지 말 것.
// -------------------------------------------------------------------
ext {
    springVersion = '5.3.39'
    springSecurityVersion = '5.8.16'
    lombokVersion = '1.18.42'
    jjwtVersion = '0.11.5'
    jacksonVersion = '2.17.2'
}

dependencies {
    // ===== Spring Web MVC =====
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-context:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"

    // ===== Spring Security =====
    implementation "org.springframework.security:spring-security-web:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-config:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-core:${springSecurityVersion}"

    // ===== JWT (jjwt) =====
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // ===== MyBatis (JPA 사용 불가) =====
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis-spring:2.1.2'

    // ===== DB (MySQL + 커넥션 풀) =====
    implementation 'com.mysql:mysql-connector-j:9.1.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // ===== Flyway (DB 마이그레이션) =====
    //  앱 기동 시 RootConfig 의 Flyway 빈이 migrate() 를 호출한다.
    //  flyway-mysql 이 없으면 런타임에 MySQL 인식 실패.
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"

    // ===== Redis (refresh 토큰 · 로그아웃 블랙리스트 · 캐시) =====
    //  Spring Data Redis 2.7.x + Lettuce. Jedis 4.x 는 spring-data-redis 2.7 과 호환되지 않아
    //  Spring 기본 클라이언트인 Lettuce 를 사용한다.
    implementation 'org.springframework.data:spring-data-redis:2.7.18'
    implementation 'io.lettuce:lettuce-core:6.2.7.RELEASE'

    // ===== JSON 직렬화 =====
    //  jsr310: LocalDateTime 등 java.time 타입을 ISO-8601 문자열로 직렬화 (FE 와 계약 일치)
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // ===== Servlet API (Tomcat 이 제공하므로 compileOnly) =====
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    // ===== 입력값 검증 (@Valid, @NotBlank 등) =====
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    implementation 'org.glassfish:javax.el:3.0.1-b12'

    // ===== 로깅 (SLF4J + Logback) =====
    implementation 'ch.qos.logback:logback-classic:1.3.14'

    // ===== Lombok (getter/setter/생성자 자동 생성) =====
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // ===================================================================
    //  Swagger (API 문서 자동화) — 【나중에 추가 예정】
    //  필수 제출물 "API 명세서" 산출물에 활용한다.
    //  학습 프로젝트의 springfox 2.9.2 는 Spring 5.3 런타임 기동 시 오류 가능성이 있어,
    //  안정적인 springdoc-openapi 등으로 별도 검토 후 이 자리에 추가한다.
    //  (뼈대 단계에서는 도입하지 않음)
    // ===================================================================

    // ===== Test (JUnit5 + Spring Test + Mockito) =====
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.springframework.security:spring-security-test:${springSecurityVersion}"
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// -------------------------------------------------------------------
//  Java 17 로 통일. toolchain 으로 컴파일 JDK 를 고정한다.
//  JDK 경로는 하드코딩하지 않는다 (윈도우/맥 혼재 — settings.gradle 의 foojay resolver 가
//  JDK 17 을 자동 탐지/다운로드한다).
// -------------------------------------------------------------------
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
    // 실제 LLM 호출 실험 테스트(TaxStrategyPipelineExperimentTest 등)를 켜는 스위치.
    // -DrunLlmExperiment=true 로 실행하지 않으면 기본적으로 스킵된다(비용·지연 있는 실제 API 호출이라).
    systemProperty 'runLlmExperiment', System.getProperty('runLlmExperiment', 'false')

    // 테스트가 끝나면 커버리지 리포트를 자동으로 만든다.
    // 테스트가 실패해도 리포트는 생성된다 — "어디를 못 덮었나" 는 실패했을 때 더 알고 싶은 정보다.
    finalizedBy jacocoTestReport
}

// -------------------------------------------------------------------
//  JaCoCo 커버리지
//    ./gradlew test          → 실행 후 리포트까지 자동 생성 (테스트가 실패해도 생성된다)
//    리포트 위치: build/reports/jacoco/test/html/index.html
//  진입점은 항상 test 다. jacocoTestReport 만 단독 실행하면 테스트를 새로 돌리지 않고
//  직전 실행 결과(build/jacoco/test.exec)로 리포트를 다시 만든다.
//  toolVersion 을 고정해 팀원·CI 간 수치가 갈리지 않게 한다.
// -------------------------------------------------------------------
jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    // dependsOn test 를 걸지 않는다. 걸면 test 가 실패했을 때 Gradle 이 "의존 태스크 실패" 로 판단해
    // 이 태스크를 건너뛴다 — 위 finalizedBy 의 의도(실패해도 리포트는 남긴다)와 정반대로 동작한다.
    // 순서는 finalizedBy 가 이미 보장하므로 의존 선언은 필요 없다.
    mustRunAfter test

    // -------------------------------------------------------------------
    //  측정 대상에서 제외할 클래스
    //
    //  아래 둘은 서블릿 컨테이너가 기동할 때 호출하는 부트스트랩 클래스다
    //  (WebApplicationInitializer 계열). 단위 테스트로 실행할 대상이 아니어서,
    //  덮으려면 "설정값이 이 값이 맞는지" 를 확인하는 테스트를 쓰게 되는데
    //  그건 설정을 두 곳에 적어두는 것일 뿐 회귀를 잡지 못한다.
    //
    //  덮을 수 없는 코드를 분모에 두면 남은 수치가 "채워야 할 것" 을 가리키지 못한다.
    //  실제로 이 둘이 미커버 35 명령어로 전체 미달분의 13% 를 차지하고 있었다.
    //
    //  주의: 여기에 추가하는 것은 "테스트하지 않기로 한 결정" 이다.
    //  덮기 번거로운 코드를 넣기 시작하면 수치가 의미를 잃는다.
    // -------------------------------------------------------------------
    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(
                            dir: it,
                            exclude: [
                                    'com/financematch/config/WebAppInitializer.class',
                                    'com/financematch/config/SecurityWebApplicationInitializer.class',
                            ])
                }))
    }

    reports {
        html.required = true   // 사람이 보는 용도
        xml.required = true    // SonarQube·Codecov 등이 읽는 용도 (지금은 미사용, 켜둬도 비용 없음)
        csv.required = false
    }
}

// Flyway 설정 (flywayInfo · flywayMigrate · flywayValidate · flywayRepair)
// 접속정보는 application-local.properties 를 재사용한다(단일 출처).
// 운영·CI 는 환경변수(DB_URL·DB_USERNAME·DB_PASSWORD)가 우선한다.
// -Pprod 는 데모 시드(dev-seed)를 제외한다.
def isProd = project.hasProperty('prod')

// -Pdemo 는 운영 빌드에 데모 시드를 다시 넣는다 (-Pprod 와 함께 쓴다).
//   포트폴리오로 공개하는 서버용이다. 방문자가 회원가입·커플연동·설문을 다 거쳐야만
//   리포트를 볼 수 있으면 아무도 끝까지 가지 않는다. 데모 계정으로 바로 완성 화면을 보여준다.
//   진짜 서비스로 전환할 때는 이 옵션만 빼면 된다.
def isDemo = project.hasProperty('demo')

def localDbProps = new Properties()
def localPropsFile = file('src/main/resources/application-local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localDbProps.load(it) }
}

flyway {
    url      = System.getenv('DB_URL')      ?: localDbProps['jdbc.url']
    user     = System.getenv('DB_USERNAME') ?: localDbProps['jdbc.username']
    password = System.getenv('DB_PASSWORD') ?: localDbProps['jdbc.password']

    locations = (isProd && !isDemo)
            ? ['filesystem:src/main/resources/db/migration']
            : ['filesystem:src/main/resources/db/migration',
               'filesystem:src/main/resources/db/dev-seed']

    encoding = 'UTF-8'
    cleanDisabled = true       // flyway clean(스키마 전체 삭제) 영구 차단
    validateOnMigrate = true   // 이미 적용된 마이그레이션 변조 감지
}

// 운영 WAR 에는 데모 시드를 물리적으로 포함시키지 않는다 (-Pdemo 를 주면 포함).
processResources {
    if (isProd) {
        if (!isDemo) {
            exclude 'db/dev-seed/**'
        }

        // 개인 개발용 비밀 설정(OpenAI 키 등)을 운영 WAR 에 담지 않는다.
        // 이 파일이 있는 상태로 빌드하면 키가 WAR 안에 박혀 서버까지 따라가고,
        // WAR 가 유출되면 키도 함께 나간다. 운영 키는 서버의 .env 로만 주입한다.
        exclude 'application-secret.properties'
    }
}
